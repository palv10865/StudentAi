plugins {
    id 'com.android.application'
}

def webAssetsDirectory = layout.buildDirectory.dir('generated/web-assets')
def prepareWebAssets = tasks.register('prepareWebAssets', Copy) {
    from(rootProject.file('../')) {
        include 'index.html', 'styles.css', 'app.js', 'gemini.js', 'subjects.js', 'tools.js'
    }
    from(rootProject.file('../vendor')) {
        into 'vendor'
    }
    into(webAssetsDirectory)
}

android {
    namespace 'com.vipinpal.studymindai'
    compileSdk 34

    def signingEnv = System.getenv()
    def hasReleaseSigning = [
        'ANDROID_KEYSTORE_PATH',
        'ANDROID_KEYSTORE_PASSWORD',
        'ANDROID_KEY_ALIAS',
        'ANDROID_KEY_PASSWORD'
    ].every { signingEnv[it] }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingEnv['ANDROID_KEYSTORE_PATH'])
                storePassword signingEnv['ANDROID_KEYSTORE_PASSWORD']
                keyAlias signingEnv['ANDROID_KEY_ALIAS']
                keyPassword signingEnv['ANDROID_KEY_PASSWORD']
            }
        }
    }

    defaultConfig {
        applicationId "com.vipinpal.studymindai"
        minSdk 24
        targetSdk 34
        def appVersionCode = project.findProperty('appVersionCode')?.toString()?.toInteger() ?: 5
        versionCode appVersionCode
        versionName "1.0.${appVersionCode}"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            assets.srcDir(webAssetsDirectory)
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(prepareWebAssets)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
