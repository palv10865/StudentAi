name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyMindAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ github.run_number }}
          name: "StudyMind AI v${{ github.run_number }}"
          body: |
            ## 📱 StudyMind AI — BTech Tutor App
            
            **Created by Vipin Pal** | BTech CSE Cyber Security Student
            
            ### What's included:
            - AI-powered step-by-step solutions
            - Maths, Physics, Mechanics, Electronics, CS solver
            - Image & PDF upload support
            - Scientific calculator, formula sheets, quiz mode
            
            ### Install:
            Download and install `app-debug.apk` on your Android device.
            *(Enable "Install from unknown sources" in Settings)*
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
