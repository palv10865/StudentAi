name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare optional release signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] && [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && [ -z "$ANDROID_KEY_ALIAS" ] && [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Configure all four Android signing secrets, or remove all four to build the installable debug APK."
            exit 1
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.release_signed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p android -PappVersionCode=${{ github.run_number }} assembleRelease

      - name: Select signed release APK
        if: steps.signing.outputs.release_signed == 'true'
        run: echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
        id: release-apk

      - name: Build installable debug APK
        if: steps.signing.outputs.release_signed != 'true'
        run: gradle --no-daemon -p android -PappVersionCode=${{ github.run_number }} assembleDebug

      - name: Select debug APK
        if: steps.signing.outputs.release_signed != 'true'
        id: debug-apk
        run: echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare consistent APK download name
        env:
          APK_PATH: ${{ steps.signing.outputs.release_signed == 'true' && steps.release-apk.outputs.apk_path || steps.debug-apk.outputs.apk_path }}
        run: cp "$APK_PATH" StudyMindAI.apk

      - name: Verify installable APK package
        env:
          APK_PATH: ${{ steps.signing.outputs.release_signed == 'true' && steps.release-apk.outputs.apk_path || steps.debug-apk.outputs.apk_path }}
        run: |
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK_PATH"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK_PATH" | grep -q "package: name='com.vipinpal.studymindai"
          for asset in index.html styles.css app.js gemini.js subjects.js tools.js \
            vendor/katex/katex.min.js vendor/katex/katex.min.css \
            vendor/marked/marked.umd.js vendor/dompurify/purify.min.js \
            vendor/highlight.js/highlight.min.js vendor/chart.js/chart.umd.js \
            vendor/html2canvas/html2canvas.min.js vendor/pdfjs/pdf.min.js \
            vendor/pdfjs/pdf.worker.min.js; do
            unzip -Z1 "$APK_PATH" | grep -qx "assets/$asset" || {
              echo "Missing bundled app asset: $asset"
              exit 1
            }
          done

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-${{ github.run_attempt }}
          name: "StudyMind AI v1.0.${{ github.run_number }}"
          body: |
            StudyMind AI Android app by Vipin Pal, built from commit ${{ github.sha }}.

            Included in this build:
            - Persistent on-device chat history and optional study memory
            - Offline-bundled study tools and browser libraries
            - Fixed Android WebView asset packaging and verified app entry page
            - Updated tutor, study tools, and local API-key handling

            AI answers require internet access and a Gemini API key. Conversation history, study memory, and the key are stored locally on the device and are not synced.
            ${{ steps.signing.outputs.release_signed == 'true' && 'This APK is signed with the configured release upload key.' || 'This APK is signed with the Android debug key. Configure the Android signing secrets before publishing to Google Play.' }}
          files: StudyMindAI.apk
          fail_on_unmatched_files: true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyMindAI-APK
          path: StudyMindAI.apk
          if-no-files-found: error
